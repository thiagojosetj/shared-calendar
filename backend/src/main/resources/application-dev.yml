# Perfil de desenvolvimento local.
# Ativado com `./mvnw spring-boot:run -Dspring-boot.run.profiles=dev` ou SPRING_PROFILES_ACTIVE=dev.
spring:
  config:
    # Lê o .env da raiz do projeto como arquivo de propriedades, para que as credenciais do banco
    # cheguem ao backend sem precisar exportar variáveis no shell — o que funciona igual no PowerShell,
    # no Git Bash e no IntelliJ. O caminho é relativo à pasta backend/, que é o diretório de trabalho do
    # spring-boot:run. "optional" evita erro se o arquivo não existir; nesse caso as variáveis de
    # ambiente continuam valendo. Só o perfil dev lê o .env: testes e produção nunca o carregam.
    import: optional:file:../.env[.properties]
  jpa:
    properties:
      hibernate:
        # Formata o SQL logado. Só faz sentido em desenvolvimento.
        format_sql: true

logging:
  level:
    # SQL executado pelo Hibernate. Útil para enxergar N+1 durante o desenvolvimento.
    org.hibernate.SQL: DEBUG
    io.github.thiagojosetj.sharedcalendar: DEBUG

management:
  endpoint:
    health:
      # Em desenvolvimento o detalhe do health ajuda a ver se o banco está de pé.
      show-details: always
